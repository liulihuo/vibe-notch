name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # manual trigger from the Actions tab

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Match the author's release build (Xcode 26.1.1 / 17B100). Xcode 16
      # flags pre-existing main-actor isolation errors in unrelated code;
      # Xcode 26 builds it cleanly.
      - name: Select Xcode 26.1.1
        run: sudo xcode-select -s /Applications/Xcode_26.1.1.app

      - name: Show selected Xcode
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild build \
            -scheme ClaudeIsland \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Automatic

      - name: Locate and zip the .app
        run: |
          # Products/ contains multiple .app bundles (e.g. Sparkle's
          # Updater.app). Target the main app by name, not the first match.
          APP="build/Build/Products/Release/Vibe Notch.app"
          echo "Found: $APP"
          cd "$(dirname "$APP")"
          ditto -c -k --keepParent "$(basename "$APP")" "$RUNNER_TEMP/app.zip"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vibe-Notch-app
          path: ${{ runner.temp }}/app.zip
          retention-days: 30
